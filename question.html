<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Question</title>
</head>
<body>
 <h1>Question</h1>


 <p id="questionText"></p>

 <p><label for="answer">Your answer:</label><input type="text" id="answer" required></p>
 <p><input type="submit" value="Submit" onclick="submitAnswer();"></p>

 <p id="message"></p>
 <p id="score"></p>

<script>
    function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(';');

        for(let i = 0; i <ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) == ' ') {
                c = c.substring(1);
            }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
            }
        }
        return "";
    }

    let session = getCookie("session");

  if (session === "") {

      document.getElementById("message").innerHTML = "No game started, please choose one ";
  }

  else {
      getQuestion();
  }
    function getQuestion() {
        fetch("https://codecyprus.org/th/api/question?session=" + session)
            .then(response => response.json())
            .then(jsonObject => {

                if (jsonObject.status == "OK") {

                    document.getElementById("questionText").innerHTML = jsonObject.questionText;
                }

                else {
                    document.getElementById("message").innerHTML = jsonObject.errorMessages;
                }


            });
  }

 function submitAnswer() {
      let answer = document.getElementById("answer").value;

      if (answer === "") {
          document.getElementById("message").innerHTML = "Please enter an answer";
          return;

      }

      fetch("https://codecyprus.org/th/api/answer?session=" + session + "&answer=" + answer)
            .then(response => response.json())
            .then(jsonObject => {
                if (jsonObject.status == "OK") {
                  if (jsonObject.correct) {
                      if (jsonObject.completed) {

                          document.getElementById("message").innerHTML = "You finished the hunt!";
                          getScore();

                      }
                      else {
                          document.getElementById("message").innerHTML = "Correct";

                          getQuestion();
                      }
                  }

                     else {
                         document.getElementById("message").innerHTML = "Wrong";
                    }

                }
                   else {
                       document.getElementById("message").innerHTML = jsonObject.errorMessages;
                }


            });
 }
    function getScore() {
        fetch("https://codecyprus.org/th/api/score?session=" + session)
            .then(response => response.json())
            .then(jsonObject => {

                if (jsonObject.status == "OK") {

                    document.getElementById("score").innerHTML = "Your score: " + jsonObject.score;
                } else {
                    document.getElementById("message").innerHTML = jsonObject.errorMessages;
                }
            });
    }

</script>
</body>
</html>
