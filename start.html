<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>start</title>
</head>
<body>
  <h1> Start the hunt</h1>

  <p id="huntld"></p>

  <p><label for="playerName">Your name:</label><input type="text" id="playerName" required></p>
  <p><input type="submit" value="Start" onclick="startHunt();"></p>

  <p id="message"></p>



<script>
   const params= new URLSearchParams(location.search);
   let uuid;
    if(params.has("uuid")) {
        uuid = params.get("uuid");

        document.getElementById("huntld").innerHTML = "Hunt ID: " + uuid;
    }
      else {
        document.getElementById("huntld").innerHTML = "No treasure hunt selected";

    }

   function setCookie(cookieName, cookieValue, expireDays) {
       let date = new Date();
       date.setTime(date.getTime() + (expireDays * 24 * 60 * 60 * 1000));
       let expires = "expires=" + date.toUTCString();
       document.cookie = cookieName + "="
           + cookieValue + ";" + expires + ";path=/";



   }
    function startHunt() {

        let playerName = document.getElementById("playerName").value;
        if(playerName ==="") {
            document.getElementById("message").innerHTML = "Please enter a valid name.";
            return;

        }



        let url = "https://codecyprus.org/th/api/start?player=" + playerName + "&app=teamAApp&treasure-hunt-id=" + uuid;

        fetch(url)
            .then(response => response.json())
            .then(jsonObject => {
                if (jsonObject.status === "OK") {
                    document.getElementById("message").innerHTML = "Started Session:" + jsonObject.session;
                    setCookie("session", jsonObject.session, 1);
                } else {

                    document.getElementById("message").innerHTML = jsonObject.errorMessages;
                }
            });

   }




</script>
</body>
</html>
